name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test -- --ci

  e2e:
    name: End-to-end tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oneid
          POSTGRES_PASSWORD: oneid
          POSTGRES_DB: oneid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneid -d oneid"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: oneid
      DB_PASSWORD: oneid
      DB_NAME: oneid
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:e2e -- --ci
